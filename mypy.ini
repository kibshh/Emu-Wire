; Type-check config, root-level so `mypy .` matches CI exactly.

[mypy]
; The SDK's runtime floor is Python 3.9, but current mypy refuses to target
; anything below 3.10. So the floor is enforced in two places instead of one:
;   - ruff's target-version = py39 rejects 3.10+ syntax at lint time
;   - the CI test matrix actually runs the suite on 3.9
; Anything 3.10-only therefore fails as a SyntaxError in CI, not silently.
python_version = 3.10
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_optional = True
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True

; A test instrument must not fail silently, and an unchecked type is a quiet
; way to do exactly that. Strict by default; relax per-module below with a
; stated reason rather than loosening the global setting.

exclude = (?x)(
    ^build/
  | ^\.venv/
  )

; Generated from protocol/protocol.yaml. Fix codegen.py, not the output.
[mypy-emuwire.protocol]
ignore_errors = True

; Third-party packages without bundled type stubs.
[mypy-serial.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True
