# Structs — composite payload members
#
# Any struct used in a repeated field MUST be fixed-size. Variable-length
# records in a DMA-fed ring buffer are how trace buffers miscount gaps.
#
# Part of the EmuWire protocol spec. Entry point: protocol/protocol.yaml

structs:


  bus_info:
    description: "One entry in a BUS_LIST response."
    fields:
      - {name: bus_id,            type: u8}
      - {name: protocol,          type: u8,  enum: bus_protocol}
      - {name: clk_pin,           type: u8}
      - {name: dat0_pin,          type: u8}
      - {name: dat1_pin,          type: u8}
      - {name: cs_pin,            type: u8}
      - {name: device_count,      type: u8}
      - {name: pio_block,         type: u8}
      - {name: pio_sm,            type: u8}
      - {name: _pad,              type: u8,  description: "Reserved, zero. Keeps the struct 4-byte aligned."}
      - {name: nominal_clock_hz,  type: u32, description: "What the host declared at BUS_CREATE."}
      - {name: measured_clock_hz, type: u32, description: "SCL frequency actually observed from the DUT. 0 if never clocked."}

  register_def:
    description: >
      One register in a device's map, sent at DEV_ATTACH. The list is sparse —
      each entry carries its own address — so a device using 0xD0-0xFC costs
      45 entries, not 256. For a streaming device (reg_addr_width = STREAMING)
      the addr field is the position in the stream, not a register address.
    fields:
      - {name: addr,  type: u16}
      - {name: value, type: u8,  description: "Initial value, after the host has merged manifest defaults with user overrides."}
      - {name: flags, type: u8,  bitmask: register_flags}

  fault_info:
    description: "One entry in a FAULT_LIST response."
    fields:
      - {name: fault_id,         type: u8}
      - {name: fault_type,       type: u8,  enum: fault_type}
      - {name: trigger,          type: u8,  enum: fault_trigger}
      - {name: probability_pct,  type: u8}
      - {name: trigger_reg,      type: u16}
      - {name: target_reg,       type: u16}
      - {name: remaining,        type: u16, description: "Firings left. FAULT_REPEAT_UNLIMITED if the fault never auto-clears."}
      - {name: access_filter,    type: u8,  enum: access_filter}
      - {name: _pad,             type: u8}
      - {name: trigger_n,        type: u32}
      - {name: param_a,          type: u32}
      - {name: param_b,          type: u32}
      - {name: fired_count,      type: u32}

  trace_edge:
    description: >
      One raw pin-state sample, streamed inside EVT_TRACE_DATA.

      The wire carries EDGES, not decoded transactions. The sniffer state
      machine pushes edges, DMA moves them into the ring buffer, and the SDK
      reconstructs transactions from them. Three reasons this split is right:

        - Fixed 8-byte records make the ring buffer trivially correct. Overflow
          accounting on variable-length records is where trace buffers get
          their bugs, and a miscounted gap is exactly the failure this project
          refuses to ship.
        - DMA can write them with no CPU involvement.
        - Decoding is the part that must cope with malformed traffic, which is
          precisely what people trace. That belongs on the host where it is
          testable against saved captures with no hardware.

      8 bytes is a power of two so ring-buffer index arithmetic is a mask.
    fields:
      - {name: timestamp,  type: u32, description: "System timer ticks. Divide by INFO.trace_tick_hz for seconds. Wraps; the WRAPPED flag marks it."}
      - {name: pin_state,  type: u8,  bitmask: pin_state, description: "Level of each line after this edge."}
      - {name: flags,      type: u8,  bitmask: trace_edge_flags}
      - {name: _pad,       type: u16}

