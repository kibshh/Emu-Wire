# Status codes — the complete error vocabulary
#
# Every command response begins with one of these. Each carries a message
# template the SDK renders, so no bare status code ever reaches a user.
#
# Part of the EmuWire protocol spec. Entry point: protocol/protocol.yaml

enums:

  # Returned by every command handler. 0 is success; everything else is a
  # failure with an actionable message. `message` is a template the SDK renders
  # — no bare status code is ever shown to a user.
  status:
    type: u8
    values:
      OK:                       {value: 0x00, message: "Success."}
      ERR_BAD_LENGTH:           {value: 0x01, message: "Frame length {len} exceeds the {max} byte limit."}
      ERR_BAD_CRC:              {value: 0x02, message: "Frame CRC mismatch — expected {expected:#06x}, got {actual:#06x}."}
      ERR_UNKNOWN_TYPE:         {value: 0x03, message: "Unknown message type {type:#04x}. Firmware protocol version is {fw_version}, the SDK expects {sdk_version}."}
      ERR_BAD_PARAM:            {value: 0x04, message: "Parameter '{param}' is invalid: {reason}."}
      ERR_NO_SUCH_BUS:          {value: 0x05, message: "No bus with id {bus_id}. Create a bus before attaching devices to it. Live buses: {live}."}
      ERR_NO_SUCH_DEVICE:       {value: 0x06, message: "No device with id {dev_id} on bus {bus_id}."}
      ERR_ADDRESS_IN_USE:       {value: 0x07, message: "{identity} on bus {bus_id} is already taken by '{existing}'. Two devices on one bus can be wired to the same address, but both then ACK and reads return the AND of both, so this is rejected as almost certainly unintended."}
      ERR_ADDRESS_RESERVED:     {value: 0x08, message: "Address {address:#04x} is reserved by the I2C specification and cannot be emulated. Reserved ranges: {ranges}."}
      ERR_BUS_LIMIT:            {value: 0x09, message: "All {max} buses are in use."}
      ERR_DEVICE_LIMIT:         {value: 0x0A, message: "Bus {bus_id} already has the maximum of {max} devices."}
      ERR_NO_FREE_SM:           {value: 0x0B, message: "No free PIO state machine. {in_use} of {total} are in use: {detail}."}
      ERR_PIO_PROGRAM_SPACE:    {value: 0x0C, message: "PIO block {block} has {free} of 32 instructions free; the {program} program needs {needed}."}
      ERR_PIN_UNAVAILABLE:      {value: 0x0D, message: "Pin GP{pin} cannot be used for {function} on {board}. Valid pins are {valid}."}
      ERR_PIN_IN_USE:           {value: 0x0E, message: "Pin GP{pin} is already used by bus {bus_id} as {function}."}
      ERR_UNSUPPORTED_PROTOCOL: {value: 0x0F, message: "Protocol '{protocol}' is not supported by this firmware. Supported: {supported}."}
      ERR_REG_OUT_OF_RANGE:     {value: 0x10, message: "Register {reg:#04x} is outside the map for '{device}', which covers {first:#04x}-{last:#04x}."}
      ERR_REG_READ_ONLY:        {value: 0x11, message: "Register {reg:#04x} on '{device}' is read-only."}
      ERR_NO_SUCH_FAULT:        {value: 0x12, message: "No fault with id {fault_id} on device {dev_id}."}
      ERR_FAULT_LIMIT:          {value: 0x13, message: "Device {dev_id} already has the maximum of {max} active faults."}
      ERR_UNSUPPORTED_FAULT:    {value: 0x14, message: "Fault '{fault}' is not supported on a {protocol} bus."}
      ERR_TRACE_ACTIVE:         {value: 0x15, message: "A trace is already running on bus {bus_id}. Stop it before starting another."}
      ERR_TRACE_NOT_ACTIVE:     {value: 0x16, message: "No trace is running on bus {bus_id}."}
      ERR_TRACE_OVERFLOW:       {value: 0x17, message: "Trace buffer overflowed; {dropped} edges were lost. The capture has a gap and must not be trusted."}
      ERR_CLOCK_OUT_OF_SPEC:    {value: 0x18, message: "The DUT is clocking bus {bus_id} at {actual_hz} Hz, above the {max_hz} Hz rating of '{device}'. The device is misbehaving as real silicon would."}
      ERR_BUSY:                 {value: 0x19, message: "Device is busy servicing the bus; retry."}
      ERR_NOT_IMPLEMENTED:      {value: 0x1A, message: "'{feature}' is accepted by the protocol but not implemented in firmware {fw_version}."}
      ERR_INTERNAL:             {value: 0x1B, message: "Internal firmware error at site {detail} in firmware {fw_version}. This is a bug — please report both numbers."}

